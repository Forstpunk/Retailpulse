[project]
name = "retailpulse"
version = "0.1.0"
description = "A production-oriented retail data engineering platform"
readme = "README.md"
authors = [
    { name = "Anis", email = "kaarthianis27@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faker>=40.36.0",
    "numpy>=2.5.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff.lint]
# UP047: suggests PEP 695 generic syntax (def foo[T](...)) over
# TypeVar-based generics. Purely stylistic modernization, not a
# correctness concern — not worth chasing across the codebase.
ignore = ["UP047"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures build calendar dates for deterministic data
# generation; timezone-awareness doesn't matter for those and
# isn't worth threading through every literal datetime() call.
"tests/**" = ["DTZ001"]

# Both are the top-level pipeline stage-failure boundary: it must
# classify and record *any* exception a stage raises (see
# pipeline/errors.py::classify_pipeline_error), so a broad
# `except Exception` here is the architecture, not an oversight.
"src/retailpulse/pipeline/runner.py" = ["BLE001"]
